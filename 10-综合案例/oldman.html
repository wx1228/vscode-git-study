    <h1>圣诞老人 （西方文化的传说人物）</h1>
    <p>圣诞老人的原型，是公元 4 世纪乐善好施的主教圣・尼古拉斯。传说他会悄悄给穷人送礼物，尤其疼爱孩子，会把礼物藏进烟囱、塞进袜子里。如今我们熟悉的红袍白胡子形象，是 19 世纪后逐渐定型的，他驾着驯鹿雪橇，在平安夜悄悄钻进烟囱，为全世界的孩子送上祝福与惊喜，成了圣诞节最温暖的符号</p>
