<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h4>图像标签：</h4><br /> 
    <img src="img.jpg"/>
    <h4>alt 替换文本 图像不能显示的时候用文字替代</h4><br /> 
    <img src="img.jpg" alt="田曦薇"/>
    <h4>title 提示文本 鼠标放到图像上，提示的文字</h4> 
    <img src="img.jpg" alt="田曦薇" title="我是田曦薇"/>
    <h4>width 给图片设置宽度</h4> 
    <img src="img.jpg" alt="田曦薇" title="我是田曦薇" width="500"/>
    <h4>height 给图片设置高度</h4> 
    <img src="img.jpg" alt="田曦 薇" title="我是田曦薇" height="500"/>
    <h4>border 给图片设置边框</h4> 
    <img src="img.jpg" alt="田曦薇" title="我是田曦薇" width="500" border="15"/>
</body>
</body>
</html>
