<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    /* 我想把ol里面的小li选出来改为pink */
    /* 后代选择器 */
    ol li {
        color: pink;
    }
    ol li a {
        color: red;
    }
    .nav li a {
        color: yellow;
    }
</style>
</head>
<body>
    <ol>
        变态写法 
        <li>我的ol的孩子</li>
        <li>我的ol的孩子</li>
        <li>我的ol的孩子</li>
        <li><a href="#">我是孙子</a></li>
    </ol>
    <ul>
        <li>我是ul的孩子</li>
        <li>我是ul的孩子</li>
        <li>我是ul的孩子</li>
        <li><a href="#">不会变化</a></li>
    </ul>
    <ul class="nav">
        <li>我是ul的孩子</li>
        <li>我是ul的孩子</li>
        <li>我是ul的孩子</li>
        <li><a href="#">不会变化</a></li>
        <li><a href="#">不会变化</a></li>
</body>
</html>
